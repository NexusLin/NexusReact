[package]
name = "nexus-rust-api"  # 项目名称
version = "0.1.0" # 版本号，遵循语义化版本规范
edition = "2024" # Rust 版本
authors = ["林太白"]      # 作者信息
license = "MIT"              # 许可证
description = "Nexus后端接口" # 项目描述
repository = "https://github.com/lintaibai/TG"  # 代码仓库
readme = "README.md"         # README 文件路径
keywords = ["rust", "后台管理"]   # 关键词

[dependencies]
# 核心依赖 features = ["full"]

# 开发 RESTful API接口
actix-web = { version = "4.6",features = ["macros"],default-features = false }

# 异步运行时，网络、文件I/O异步任务
tokio = { version = "1", features = ["rt", "net"], default-features = false } 

# 数据库相关
sqlx = { version = "0.7", features = ["mysql","runtime-tokio-rustls", "macros", "chrono", "uuid"], default-features = false} 

# 序列化相关
# 序列化和反序列化
serde = { version = "1.0", features = ["derive"], default-features = false } 
 # JSON序列化和反序列化
serde_json = { version = "1.0", features = ["raw_value"], default-features = false }

# 认证和安全
bcrypt = "0.15" # 密码加密
jsonwebtoken = "9" # JSON Web Token (JWT)认证

# 文件处理
# 处理文件上传
actix-multipart = { version = "0.4", default-features = false }
# 静态文件服务
actix-files = { version = "0.6.2", default-features = false }
# 猜测文件类型
mime_guess = { version = "2.0", default-features = false }
# 帮我们生成文件名
uuid = { version = "1.17.0", features = ["v4"], default-features = false }
csv = "1.1" # CSV文件处理
# 解析Excel（.xlsx/.xls/.ods）
umya-spreadsheet = "1.1"


# 工具库
# 处理日期和时间
chrono = { version = "0.4", features = ["serde"], default-features = false }
# 从环境变量加载配置
dotenv = "0.15"
# 使用和管理异步操作
futures = { version = "0.3", default-features = false }

# 日志
# 日志记录
log = { version = "0.4", default-features = false }
# 环境变量配置日志记录
env_logger = { version = "0.9", default-features = false }

# 跨域
actix-cors = { version = "0.6", default-features = false }


# 公共依赖版本